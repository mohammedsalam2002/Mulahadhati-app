name: notes_app
description: "تطبيق ملاحظات احترافي مع دعم اللغة العربية والوضع الليلي"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  provider: ^6.1.5

  # التخزين المحلي
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # التنسيق والواجهة
  intl: ^0.20.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.3
  cupertino_icons: ^1.0.8

  # الأمان والتشفير
  local_auth: ^2.3.0
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4

  # تنسيق النص الغني (v11 يدعم intl 0.20)
  flutter_quill: ^11.5.0

  # التصدير
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^10.1.4

  # نسخ احتياطي
  file_picker: ^8.3.7
  permission_handler: ^11.4.0

  # فتح الروابط
  url_launcher: ^6.3.2

  # أدوات مساعدة
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  min_sdk_android: 21

# إعدادات شاشة البداية
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/splash_logo.png
  color_dark: "#121212"
  image_dark: assets/icons/splash_logo.png
  android_12:
    image: assets/icons/splash_logo.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/icons/splash_logo.png
    icon_background_color_dark: "#121212"